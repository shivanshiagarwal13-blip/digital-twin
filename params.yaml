simulator_assumptions:
  hb_curve_shape: Hb(t) = Hb0 + gain_max * (1 - exp(-k * t_days))
  k_per_day:
    value: 0.04
    status: assumption
    note: tune so mean Hb matches Athiyarath week 8 and week 20
  gain_max_responders:
    value: 3.5
    status: assumption
    note: tune the same way
  gain_max_non_responders:
    value: 0.5
    status: assumption
    note: tune to match Okam Figure 1 share reaching +1 and +2 g/dL
  measurement_noise_sd:
    value: 0.1
    status: assumption
    note: pick from Dryad within-patient scatter
    then say so: null
  non_responder_fraction_default:
    value: 0.272
    status: derived
