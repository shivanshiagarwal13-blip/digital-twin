response_rule:
  day14_rise_threshold:
    value: 1.0
    unit: g/dL
    source: Okam, Koch & Tran, Haematologica 2016;101:e6-e7
    page: p. e6
    status: sourced
    note: responder = Hb rise >= 1.0 at day 14; non-responder = rise < 1.0
  accuracy_of_rule:
    sensitivity: 0.901
    specificity: 0.793
    ppv: 0.929
    source: Okam 2016
    page: p. e6
    status: sourced
    note: CHECK IN THE PDF which later outcome these refer to; sheet does not say.
      Write it correctly in README.
